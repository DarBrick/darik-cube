<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="darikcube - Software Engineer & Creator. Explore my portfolio of web applications and projects." />
    <title>darikcube</title>
    <script>
      // GitHub Pages SPA redirect handler
      // Static files (robots.txt, sitemap.xml, etc.) are served directly and won't hit this page
      // This script only handles SPA routes that need to be redirected to index.html
      (function() {
        var path = window.location.pathname;
        
        // List of static file extensions and paths that should never be redirected to SPA
        var staticExtensions = ['.txt', '.xml', '.json', '.ico', '.svg', '.png', '.jpg', '.jpeg', '.gif', '.pdf'];
        var isStaticFile = staticExtensions.some(function(ext) {
          return path.endsWith(ext);
        });
        
        // If it's a static file, don't redirect - let it 404 naturally or be served
        if (!isStaticFile) {
          // For SPA routes, redirect to index.html with the path in session storage
          sessionStorage.setItem('redirect', window.location.href);
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
